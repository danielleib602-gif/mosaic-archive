[build-system]
requires = ["maturin==1.11.5"]
build-backend = "maturin"

[project]
name = "mosaic-archive"
version = "0.39.0"
description = "Experimental general-purpose adaptive encrypted archive format"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mosaic Archive contributors" }]
keywords = ["archive", "compression", "deduplication", "encryption"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Archiving :: Compression",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "backports.zstd>=1.6,<2; python_version < '3.14'",
  "cryptography>=50.0.0,<51",
]

[project.urls]
Repository = "https://github.com/danielleib602-gif/mosaic-archive"
Issues = "https://github.com/danielleib602-gif/mosaic-archive/issues"
Changelog = "https://github.com/danielleib602-gif/mosaic-archive/blob/main/CHANGELOG.md"
Documentation = "https://github.com/danielleib602-gif/mosaic-archive#readme"

[project.optional-dependencies]
dev = [
  "mypy>=2.1,<3",
  "ruff>=0.12,<1",
]
release = [
  "pyinstaller==6.22.0",
]

[project.scripts]
msc = "mosaic_archive.cli:main"

[tool.maturin]
manifest-path = "native/msc7-python/Cargo.toml"
python-source = "src"
module-name = "mosaic_archive._native"
bindings = "pyo3"
locked = true
strip = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
