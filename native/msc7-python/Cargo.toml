[package]
name = "mosaic-msc7-python"
version = "0.39.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Private ABI3 Python binding for the non-stable authenticated MSC7 preview"

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false

[dependencies]
mosaic-msc7-core = { path = "../msc7-core" }
pyo3 = { version = "=0.29.0", features = ["abi3-py311"] }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
