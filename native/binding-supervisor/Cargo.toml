[package]
name = "mosaic-binding-supervisor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Non-authoritative native cgroup delegation supervisor for Mosaic"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.189"
rustix = { version = "=1.1.4", default-features = false, features = ["rand"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
