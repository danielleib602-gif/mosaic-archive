name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen python -m unittest discover -s tests -v

  quality-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv sync --frozen --extra dev --extra release
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy src
      - run: uv run --frozen --with coverage coverage run -m unittest discover -s tests
      - run: uv run --frozen --with coverage coverage report --fail-under=80
      - run: uv run --frozen --with bandit==1.9.4 bandit -q -r src -lll
      - run: uv run --frozen --with pip-audit pip-audit --local
      - run: uv run --frozen msc readiness --require-automatic --json
      - run: uv build
      - run: uv run --frozen python -m mosaic_archive.corpus .ci-corpus --unit-size 4096

  native-supervisor:
    name: native Linux supervisor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv sync --frozen
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
      - run: cargo +1.96.0 fmt --all --check
      - run: cargo +1.96.0 clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +1.96.0 test --workspace --locked
      - run: cargo +1.96.0 build --workspace --release --locked
      - name: Exercise a real delegated cgroup lifecycle
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cgroup_root=/sys/fs/cgroup
          parent="$cgroup_root/mosaic-native-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$parent" =~ ^/sys/fs/cgroup/mosaic-native-ci-[0-9]+-[0-9]+$ ]] || {
            echo "refusing unsafe cgroup path: $parent" >&2
            exit 1
          }

          cleanup() {
            local failed=0
            local session
            if [[ -d "$parent" ]]; then
              if [[ -e "$parent/cgroup.kill" ]]; then
                printf '1' | sudo tee "$parent/cgroup.kill" >/dev/null || failed=1
              fi
              shopt -s nullglob
              for session in "$parent"/mosaic-supervisor-[0-9a-f]*; do
                [[ "${session##*/}" =~ ^mosaic-supervisor-[0-9a-f]{32}$ ]] || {
                  echo "refusing unexpected session child: $session" >&2
                  failed=1
                  continue
                }
                sudo rmdir -- "$session" || failed=1
              done
              sudo rmdir -- "$parent" || failed=1
            fi
            return "$failed"
          }
          trap 'cleanup || true' EXIT

          [[ "$(stat -fc %T "$cgroup_root")" == cgroup2fs ]]
          available=" $(<"$cgroup_root/cgroup.controllers") "
          for controller in cpuset memory pids; do
            [[ "$available" == *" $controller "* ]] || {
              echo "root cgroup lacks $controller" >&2
              exit 1
            }
            enabled=" $(<"$cgroup_root/cgroup.subtree_control") "
            if [[ "$enabled" != *" $controller "* ]]; then
              printf '+%s' "$controller" | sudo tee "$cgroup_root/cgroup.subtree_control" >/dev/null
            fi
          done

          sudo mkdir -- "$parent"
          uid="$(id -u)"
          gid="$(id -g)"
          sudo chown "$uid:$gid" -- \
            "$parent" \
            "$parent/cgroup.procs" \
            "$parent/cgroup.subtree_control" \
            "$parent/cgroup.threads"
          export MOSAIC_NATIVE_CGROUP_PARENT="$parent"

          set +e
          PYTHONPATH=src uv run --frozen python tools/run_native_cgroup_integration.py
          test_status=$?
          set -e
          trap - EXIT
          cleanup_status=0
          cleanup || cleanup_status=$?
          if (( test_status != 0 )); then
            exit "$test_status"
          fi
          exit "$cleanup_status"

  native-supervisor-windows:
    name: native Windows supervisor
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
      - run: cargo +1.96.0 fmt --all --check
      - run: cargo +1.96.0 clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +1.96.0 test --workspace --locked
      - run: cargo +1.96.0 build --workspace --release --locked
